plugins { id 'com.android.application' }
android {
    namespace 'jp.examapp.offline'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.examapp.offline'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "jp.examapp.offline.ImportInstrumentation"
        versionCode 2
        versionName '1.0.1'
    }
    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
