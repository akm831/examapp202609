name: Android offline APK
on:
  push:
    branches: ['feat/android-offline', 'main']
    paths: ['mobile/**', 'data/**', 'src/app/globals.css', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', 'data/**', 'src/app/globals.css', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test history import and review logic
        run: node --test mobile/web/core.test.cjs
      - name: Bundle reviewed questions and textbooks
        run: python3 mobile/build_assets.py
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: examapp-offline-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
